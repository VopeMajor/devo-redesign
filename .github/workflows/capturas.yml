name: Capturas mobile

on:
  push:
    branches-ignore: [main, 'infra/arte', 'arte-saida/**', 'infra-logs/**', 'capturas/**']
    # Mudança só de documentação ou de pedidos de arte não refaz as capturas (e não cancela a rodada em curso).
    paths-ignore: ['docs/**', 'arte/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:devo@localhost:5432/postgres
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: devo-ci-secret-only-for-local-tests-0000000000
      NEXT_TELEMETRY_DISABLED: 1
      DEVO_STYLEGUIDE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependências
        run: pnpm install --no-frozen-lockfile
      - name: Banco de teste
        run: |
          for f in scripts/dev/00-base.sql scripts/deadly-votes-migration.sql scripts/deadly-votes-group-migration.sql scripts/auth-migration.sql scripts/arcade-migration.sql scripts/arcade-points-migration.sql scripts/arcade-rooms-migration.sql scripts/test-accounts-migration.sql scripts/character-name-migration.sql scripts/fundacao-migration.sql scripts/poco-migration.sql scripts/staff-migration.sql scripts/torres-migration.sql scripts/salao-migration.sql scripts/cosmeticos-migration.sql scripts/virtudes-migration.sql scripts/corporacoes-migration.sql scripts/narrativa-migration.sql scripts/calendario-migration.sql scripts/cartas-raridade-migration.sql scripts/dv-recompensas-migration.sql scripts/arcanos-estagios-migration.sql scripts/dev/90-seed.sql scripts/dev/91-seed-poco.sql scripts/dev/92-seed-torres.sql scripts/dev/93-seed-salao.sql scripts/dev/94-seed-cosmeticos.sql scripts/dev/95-seed-virtudes.sql scripts/dev/96-seed-corporacoes.sql scripts/dev/91-seed-narrativa.sql scripts/dev/97-seed-calendario.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Tipos
        run: pnpm exec tsc --noEmit -p . 2>&1 | tee typecheck.log || true
      - name: Build
        run: pnpm build 2>&1 | tee build.log
      - name: Servidor
        run: |
          (pnpm start > server.log 2>&1 &)
          npx -y wait-on@8 http://localhost:3000 -t 120000
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && echo '{}' > /tmp/pw/package.json && npm i --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Capturas
        run: CAPTURE_ONLY="$(cat .capture-only 2>/dev/null || true)" PLAYWRIGHT_FROM=/tmp/pw/package.json node scripts/dev/capture.mjs 2>&1 | tee capture.log
        continue-on-error: true
      - name: Teste de servidor (Fundação)
        run: node scripts/dev/fundacao-test.mjs 2>&1 | tee fundacao-test.log
        continue-on-error: true
      - name: Teste de servidor (Poço)
        run: node scripts/dev/poco-test.mjs 2>&1 | tee poco-test.log
        continue-on-error: true
      - name: Teste de servidor (Staff e Deadly Vote)
        run: node scripts/dev/staff-test.mjs 2>&1 | tee staff-test.log
        continue-on-error: true
      - name: Teste de servidor (Torres de Ruptura)
        run: node scripts/dev/torres-test.mjs 2>&1 | tee torres-test.log
        continue-on-error: true
      - name: Teste de servidor (Salão das Máscaras)
        run: node scripts/dev/salao-test.mjs 2>&1 | tee salao-test.log
        continue-on-error: true
      - name: Teste de servidor (Cosméticos)
        run: node scripts/dev/cosmeticos-test.mjs 2>&1 | tee cosmeticos-test.log
        continue-on-error: true
      - name: Teste de servidor (Virtudes)
        run: node scripts/dev/virtudes-test.mjs 2>&1 | tee virtudes-test.log
        continue-on-error: true
      - name: Teste de servidor (Corporações)
        run: node scripts/dev/corporacoes-test.mjs 2>&1 | tee corporacoes-test.log
        continue-on-error: true
      - name: Teste de servidor (Narrativa)
        run: node scripts/dev/narrativa-test.mjs 2>&1 | tee narrativa-test.log
        continue-on-error: true
      - name: Teste de servidor (Calendário)
        run: node scripts/dev/calendario-test.mjs 2>&1 | tee calendario-test.log
        continue-on-error: true
      - name: Banco novo confere com as migrações
        run: |
          bash scripts/dev/gerar-banco-novo.sh /tmp/devo-banco-novo.sql
          if diff -q scripts/devo-banco-novo.sql /tmp/devo-banco-novo.sql; then echo "devo-banco-novo.sql em dia" | tee banco-novo.log; else echo "DESATUALIZADO: rode scripts/dev/gerar-banco-novo.sh" | tee banco-novo.log; fi
          psql "postgres://postgres:devo@localhost:5432/postgres" -q -c 'CREATE DATABASE devo_novo'
          psql "postgres://postgres:devo@localhost:5432/devo_novo" -v ON_ERROR_STOP=1 -q -f scripts/devo-banco-novo.sql 2>&1 | tee -a banco-novo.log
          psql "postgres://postgres:devo@localhost:5432/devo_novo" -v ON_ERROR_STOP=1 -q -f scripts/devo-banco-novo.sql 2>&1 | tee -a banco-novo.log
          echo "banco novo aplicado duas vezes: ok" | tee -a banco-novo.log
        continue-on-error: true
      - name: Logs
        if: always()
        run: mkdir -p shots && cp -f build.log typecheck.log server.log capture.log fundacao-test.log poco-test.log staff-test.log torres-test.log salao-test.log cosmeticos-test.log virtudes-test.log corporacoes-test.log narrativa-test.log calendario-test.log banco-novo.log shots/ 2>/dev/null || true
      - name: Publicar capturas na branch capturas/<branch>
        if: always()
        run: |
          BR="capturas/${GITHUB_REF_NAME}"
          SHA=$(git rev-parse --short HEAD)
          cd shots
          echo "$GITHUB_SHA" > SOURCE_SHA
          git init -q -b "$BR"
          git config user.name "devo-ci"; git config user.email "ci@devo.local"
          git add -A && git commit -qm "capturas de ${SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR:$BR"
