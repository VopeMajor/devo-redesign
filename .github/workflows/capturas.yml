name: Capturas mobile

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:devo@localhost:5432/postgres
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: devo-ci-secret-only-for-local-tests-0000000000
      NEXT_TELEMETRY_DISABLED: 1
      DEVO_STYLEGUIDE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependências
        run: pnpm install --no-frozen-lockfile
      - name: Banco de teste
        run: |
          for f in scripts/dev/00-base.sql scripts/deadly-votes-migration.sql scripts/auth-migration.sql scripts/arcade-migration.sql scripts/arcade-points-migration.sql scripts/arcade-rooms-migration.sql scripts/test-accounts-migration.sql scripts/character-name-migration.sql scripts/dev/90-seed.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Tipos
        run: pnpm exec tsc --noEmit -p . 2>&1 | tee typecheck.log || true
      - name: Build
        run: pnpm build 2>&1 | tee build.log
      - name: Servidor
        run: |
          (pnpm start > server.log 2>&1 &)
          npx -y wait-on@8 http://localhost:3000 -t 120000
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && echo '{}' > /tmp/pw/package.json && npm i --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Capturas
        run: CAPTURE_ONLY="$(cat .capture-only 2>/dev/null || true)" PLAYWRIGHT_FROM=/tmp/pw/package.json node scripts/dev/capture.mjs 2>&1 | tee capture.log
        continue-on-error: true
      - name: Logs
        if: always()
        run: mkdir -p shots && cp -f build.log typecheck.log server.log capture.log shots/ 2>/dev/null || true
      - name: Publicar capturas na branch capturas/<branch>
        if: always()
        run: |
          BR="capturas/${GITHUB_REF_NAME}"
          SHA=$(git rev-parse --short HEAD)
          cd shots
          echo "$GITHUB_SHA" > SOURCE_SHA
          git init -q -b "$BR"
          git config user.name "devo-ci"; git config user.email "ci@devo.local"
          git add -A && git commit -qm "capturas de ${SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR:$BR"
