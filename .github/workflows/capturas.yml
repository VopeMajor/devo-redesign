name: Capturas mobile

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:devo@localhost:5432/postgres
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: devo-ci-secret-only-for-local-tests-0000000000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependências
        run: pnpm install --no-frozen-lockfile
      - name: Banco de teste
        run: |
          for f in scripts/dev/00-base.sql scripts/deadly-votes-migration.sql scripts/auth-migration.sql scripts/arcade-migration.sql scripts/arcade-points-migration.sql scripts/arcade-rooms-migration.sql scripts/dev/90-seed.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Tipos
        run: pnpm exec tsc --noEmit -p . 2>&1 | tee typecheck.log || true
      - name: Build
        run: pnpm build 2>&1 | tee build.log
      - name: Servidor
        run: |
          (pnpm start > server.log 2>&1 &)
          npx -y wait-on@8 http://localhost:3000 -t 120000
      - name: Playwright
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Capturas
        run: NODE_PATH=/tmp/pw/node_modules node scripts/dev/capture.mjs
        env:
          CAPTURE_ONLY: ${{ vars.CAPTURE_ONLY }}
      - name: Logs
        if: always()
        run: mkdir -p shots && cp -f build.log typecheck.log server.log shots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: shots/
          retention-days: 14
