<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <!-- RESERVA: o Corvo ainda não tem sprite do dono. Silhueta encapuzada na mesma tela do elenco
       (cabeça entre ~17% e ~53% da altura, centro em x=540), para trocar sem mexer no enquadramento. -->
  <defs>
    <linearGradient id="manto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="0.55" stop-color="#151518"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="vazio" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.7" stop-color="#050506"/>
      <stop offset="1" stop-color="#121215"/>
    </radialGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece5d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#bab09f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6b6357" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- manto: ombros caindo até a base -->
  <path d="M540 430 C 430 470 330 540 250 640 C 190 715 150 820 130 960 L 950 960 C 930 820 890 715 830 640 C 750 540 650 470 540 430 Z" fill="url(#manto)" stroke="url(#borda)" stroke-width="3"/>
  <!-- capuz -->
  <path d="M540 120 C 420 120 345 215 335 335 C 326 440 352 520 400 585 C 445 640 500 660 540 664 C 580 660 635 640 680 585 C 728 520 754 440 745 335 C 735 215 660 120 540 120 Z" fill="url(#manto)" stroke="url(#borda)" stroke-width="3"/>
  <!-- abertura do capuz (rosto em sombra) -->
  <path d="M540 210 C 462 210 418 280 414 360 C 410 440 440 505 482 548 C 506 572 526 582 540 584 C 554 582 574 572 598 548 C 640 505 670 440 666 360 C 662 280 618 210 540 210 Z" fill="url(#vazio)"/>
  <!-- bico sugerido na sombra -->
  <path d="M540 380 L 566 452 L 540 520 L 514 452 Z" fill="#1d1d21" opacity="0.8"/>
  <!-- brilho fraco dos olhos -->
  <circle cx="497" cy="372" r="5" fill="#bab09f" opacity="0.55"/>
  <circle cx="583" cy="372" r="5" fill="#bab09f" opacity="0.55"/>
  <!-- dobra central do manto -->
  <path d="M540 664 C 530 760 528 860 532 960" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="4"/>
</svg>
