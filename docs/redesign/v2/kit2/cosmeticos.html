// ---------- Aros de nível Lista: a FORMA diz a raridade (sobrevive a 48 e 24 px) ----------

  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${grad[0]}"/><stop offset=".5" stop-color="${grad[1]}"/><stop offset="1" stop-color="${grad[2]}"/></linearGradient>
    <clipPath id="${id}c"><circle cx="24" cy="24" r="15.5"/></clipPath></defs>`;
  if (r === 'arcano') s += `<ellipse cx="24" cy="24" rx="23" ry="8" fill="none" stroke="#d3caf5" stroke-width="1.6" transform="rotate(-28 24 24)" opacity=".9"/>`;
  s += foto ? `<image href="${RET}" x="6" y="5" width="36" height="44" clip-path="url(#${id}c)" preserveAspectRatio="xMidYMin slice"/>` : `<circle cx="24" cy="24" r="15.5" fill="#2a2333"/>`;
  const lw = { comum: 3.5, incomum: 4, raro: 4, epico: 4, lendario: 4.5, arcano: 3.5 }[r];
  s += `<circle cx="24" cy="24" r="${15.5 + lw / 2}" fill="none" stroke="url(#${id})" stroke-width="${lw}"/>`;
  if (r === 'arcano') s += `<circle cx="24" cy="24" r="21.5" fill="none" stroke="url(#${id})" stroke-width="1.4"/><path d="M5 31 A21 8 -28 0 0 43 17" fill="none" stroke="#fff" stroke-width="1.8" transform="rotate(0)" opacity=".95"/>`;
  if (r === 'incomum') s += `<path d="M20 4.5 L24 9.5 L28 4.5Z" fill="#0b0a0f"/><circle cx="24" cy="6.6" r="2.4" fill="#a9d6bd" stroke="#e2c9a0" stroke-width=".8"/>`;
  if (r === 'raro') for (let k = 0; k < 4; k++) { const a = (k * 90 + 45) * Math.PI / 180, x = c + 19 * Math.cos(a), y = c + 19 * Math.sin(a); s += `<use href="#estrela4" x="${x - 5}" y="${y - 5}" width="10" height="10" fill="#f4f6ff"/>`; }
  if (r === 'epico') s += `<path d="M24 41 V44" stroke="#d9b6ee" stroke-width="1.4"/><path d="M24 43 L27.4 47.5 L24 52 L20.6 47.5Z" fill="#b98bd6" stroke="#f3e2ff" stroke-width=".9"/>`;

// ---------- Balão vetorial (para comparar com o pintado) ----------
function balaoVet(el, tipo) {
  const B = { papel: { f: ['#efe6d4', '#ddd0b6'], aro: '#b7a27a', orn: '#b7a27a', txt: '#2a1a16' }, comum: { f: ['#26242c', '#18171c'], aro: 'rgba(168,163,154,.55)', txt: '#e6e2dc' } }[tipo];
  const w = el.offsetWidth + 12, h = el.offsetHeight + 8, id = 'bv' + Math.random().toString(36).slice(2, 7);
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${B.f[0]}"/><stop offset="1" stop-color="${B.f[1]}"/></linearGradient></defs>`;
  s += `<path d="M10 4 H${w - 10} Q${w - 4} 4 ${w - 4} 10 V${h - 12} Q${w - 4} ${h - 5} ${w - 10} ${h - 5} H18 L8 ${h} L11 ${h - 6} Q4 ${h - 8} 4 ${h - 14} V10 Q4 4 10 4Z" fill="url(#${id})" stroke="${B.aro}" stroke-width="1"/>`;
  if (B.orn) s += [[6, 8, 1], [w - 6, 8, -1]].map(([x, y, sx]) => `<g transform="translate(${x} ${y}) scale(${sx} 1)" fill="none" stroke="${B.orn}" stroke-width=".9"><path d="M0 0 C5 -5 12 -4 14 1 C15 5 10 6 8 3"/><path d="M0 0 C4 5 10 7 17 6"/></g>`).join('');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('preserveAspectRatio', 'none'); svg.innerHTML = s;
  el.prepend(svg); el.style.color = B.txt;
}
