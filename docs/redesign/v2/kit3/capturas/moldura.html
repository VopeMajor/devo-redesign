<!doctype html>
<meta charset="utf-8">
<title>Moldura de celular para capturas</title>
<body style="margin:0;background:#000">
<iframe id="f" width="390" height="844" style="border:0;display:block"></iframe>
<script>
const q=new URLSearchParams(location.search),p=q.get('p')||'casa.html';q.delete('p');
if(q.has('ap')){localStorage.setItem('devo-aparencia',q.get('ap'));q.delete('ap')}
document.getElementById('f').src='../'+p+'?'+q;
</script>
